<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
    <title>Relic Hunter: Pixel Archives</title>
</head>
<body>
    <div class="personagem" id="personagem">
        <img src="img/mago.png" alt="">
    </div>
    
    <section class="cards">
        <div class="coracoes">
            <img src="img/coraçoes.png" alt="">
         </div>
        <div class="mana">
            <img src="img/mana.png" alt="">
        </div>
    </section>
    

    <div class="dragao">
        <img src="img/dragao.png" alt="">
    </div>
    <div class="bossBar">
        <img src="img/bossBar.png" alt="">
    </div>
    <div class="dragzin">
        <img src="img/dragzin.png" alt="">
    </div>


    <section class="superiorEsquerdo">
        <div class="botao">
            <div class="pausar">
                <button>⏸</button>
            </div>    
            <div class="btnReiniciar" id="reiniciar">
                <button>↻</button>
            </div>
        </div>

        <div class="progressBar">
            <img src="img/progressBar.png" alt="">
        </div>
        <div class="vidas">
            <img src="img/vidas.png" alt="">
        </div>
    </section>

    <section class="itens">
        <div class="potMana" id="potMana">
            <img src="img/potMana.png" id="imgMana" alt="">
        </div>

        <div class="bau" id="bau">
        <img src="img/bau.png" alt="">
        </div>

        <div class="escudo" id="escudo">
            <img src="img/escudo.png" alt="">
        </div>

        <div class="potCura" id="potCura">
            <img src="img/potCura.png" id="imgCura" alt="">
        </div>
    </section>

    <div class="morte">
        <h2>Você <br>morreu!</h2>
    </div>
    <div class="vitoria">
        <h2>Você <br>venceu!</h2>
    </div>
        
</body>
</html>
